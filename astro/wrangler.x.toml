name = "bokken-x"
main = "./workers/site-router.mjs"
compatibility_date = "2026-08-29"
workers_dev = true
preview_urls = false

[vars]
SITE_KIND = "x"

[assets]
directory = "./dist/workers/x"
binding = "ASSETS"
run_worker_first = ["/assets/*", "/clear-site-data/*"]
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
