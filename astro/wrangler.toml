name = "bokken-blog"
main = "./workers/site-router.mjs"
compatibility_date = "2026-08-29"
workers_dev = true
preview_urls = false

[vars]
SITE_KIND = "blog"

[assets]
directory = "./dist/workers/blog"
binding = "ASSETS"
run_worker_first = ["/assets/*"]
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
